# Opt-in worker: docker compose -f compose.yaml -f compose.strava.yaml run --rm strava-sync
services:
  personal-os-api:
    env_file: [".local/strava/api.env"]
  strava-sync:
    build: ./backend
    profiles: [strava]
    command: ["--spring.profiles.active=strava-sync"]
    env_file: [".local/strava/sync.env"]
    environment:
      JDBC_URL: jdbc:postgresql://database:5432/personal_os
      DB_USERNAME: personal_os
      DB_PASSWORD: local-personal-os-only
    depends_on:
      database:
        condition: service_healthy
      personal-os-api:
        condition: service_started
    read_only: true
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]