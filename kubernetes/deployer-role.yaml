apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: personal-os-deployer
  namespace: personal-os
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [personal-os-api, personal-os-frontend]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [services]
    resourceNames: [personal-os-web]
    verbs: [get]
