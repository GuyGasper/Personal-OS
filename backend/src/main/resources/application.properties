spring.application.name=personal-os-api
server.address=0.0.0.0
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
app.version=${APP_VERSION:0.1.0}

# Expose status-only health endpoints, without environment or metrics data.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoints.web.base-path=/
management.endpoint.health.group.live.include=livenessState
management.endpoint.health.group.ready.include=readinessState
