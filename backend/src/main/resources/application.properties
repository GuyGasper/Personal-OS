spring.application.name=personal-os-api
server.address=0.0.0.0
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
app.version=${APP_VERSION:0.1.0}

# Expose status-only health endpoints, without environment or metrics data.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoints.web.base-path=/
management.endpoint.health.group.live.include=livenessState
management.endpoint.health.group.ready.include=readinessState,db

# Production values come from the namespace-local database-credentials Secret.
spring.datasource.url=${JDBC_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.schema=personal_os
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=5

# Keep application objects separate from infrastructure's public restore probe.
spring.flyway.default-schema=personal_os
spring.flyway.schemas=personal_os
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true

# Strava is opt-in; the HTTP API needs only the private read credential.
strava.athlete-id=${STRAVA_ATHLETE_ID:0}
strava.client-id=${STRAVA_CLIENT_ID:}
strava.client-secret=${STRAVA_CLIENT_SECRET:}
strava.refresh-token=${STRAVA_REFRESH_TOKEN:}
strava.token-encryption-key=${STRAVA_TOKEN_ENCRYPTION_KEY:}
strava.read-token=${STRAVA_READ_TOKEN:}
strava.lookback-days=${STRAVA_LOOKBACK_DAYS:30}
strava.max-pages=${STRAVA_MAX_PAGES:80}
strava.full-sync-hours=${STRAVA_FULL_SYNC_HOURS:24}
